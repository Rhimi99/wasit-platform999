# WASIT web — static SPA + reverse proxy for the API and crawler routes.
# Mirrors the Vite dev proxy so the session cookie remains same-origin.

upstream wasit_api {
    server api:3000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the served SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Immutable hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + crawler routes are proxied to the backend (same origin as the SPA).
    location /api/ {
        proxy_pass http://wasit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml { proxy_pass http://wasit_api; proxy_set_header Host $host; }
    location = /robots.txt  { proxy_pass http://wasit_api; proxy_set_header Host $host; }

    # SPA fallback — client-side routing owns the remaining paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}