<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LE WASSIT — Business Global. La plateforme du commerce numérique mondial. WASIT — منصة الوساطة التجارية العالمية." />
    <meta name="robots" content="index,follow" />
    <!-- LE WASSIT identity (A · AXIS): one mark in every browser and launcher context.
         The raster sizes are explicit so browsers that ignore SVG favicons still
         get the tested 16/24/32 px rendering rather than a rescaled blur. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-24.png" sizes="24x24" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1a45" />
    <!-- Open Graph defaults; SeoHead overrides per route. -->
    <meta property="og:site_name" content="LE WASSIT" />
    <meta property="og:type" content="website" />
    <title>LE WASSIT — Business Global</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
