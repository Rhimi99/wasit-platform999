name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: type-check both packages and build the server bundle.
  static:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2
      - run: npm run typecheck
      - run: npm run build -w @wasit/web
      - run: npm run build:prod -w @wasit/server

  # Unit + integration tests against a real PostgreSQL service.
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_PASSWORD: wasit_dev_password
          POSTGRES_DB: wasit_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wasit:wasit_dev_password@localhost:5432/wasit_dev
      TEST_DATABASE_URL: postgresql://wasit:wasit_dev_password@localhost:5432/wasit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2
      # vitest globalSetup drops/creates wasit_test and runs migrations + seed.
      - run: npm test

  # Development Agent repair sandbox. Builds the `repair` image (full dependency
  # closure, incl. vitest) and runs the container-isolation acceptance tests with
  # a REAL Docker daemon. The job is FAIL-CLOSED: it asserts a working daemon, a
  # present image, and that G1/G2/H each actually ran and passed, so a missing
  # daemon (which would skip the tests and let vitest exit 0) fails the job rather
  # than passing green. It does not touch the database.
  repair-sandbox:
    name: Repair sandbox isolation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2
      # (1) Fail loudly if the runner has no usable Docker daemon. Without this,
      # the container-isolation tests below are skipped and vitest still exits 0.
      - name: Require a working Docker daemon
        run: docker info
      # Build only the repair stage; the production `runtime` image is untouched.
      - name: Build repair sandbox image
        run: docker build --target repair -t wasit-repair-sandbox:local .
      # (2) Fail if the image is not actually present (a no-op or failed build).
      - name: Assert repair sandbox image exists
        run: docker image inspect wasit-repair-sandbox:local >/dev/null
      # Run the DB-free self-repair suite from the repo root so no server vitest
      # config (which requires TEST_DATABASE_URL) is picked up. Emit BOTH the
      # default console reporter (so a failure, incl. H, is visible in the job
      # log) and the JSON reporter (dot-notation outputFile) the next step
      # asserts against.
      - name: Run self-repair suite (console + JSON report)
        run: >-
          npx vitest run packages/server/tests/self-repair-tool.test.ts
          --reporter=default --reporter=json
          --outputFile.json=/tmp/repair-sandbox-report.json
      # (3) Fail unless G1, G2 and H each ran and passed. Vitest exits 0 when a
      # whole describe block is skipped, so this assertion is what makes a missing
      # Docker daemon (or a skipped/failed test) a hard CI failure instead of a
      # silent green. Titles are matched by the exact prefixes "G1. ", "G2. " and
      # "H. " (a space follows the number), so a different test cannot satisfy the
      # check by partial match.
      - name: Assert G1/G2/H ran and passed
        run: |
          node -e 'const fs=require("node:fs");const p="/tmp/repair-sandbox-report.json";if(!fs.existsSync(p)){console.error("FATAL: vitest JSON report not found at "+p);process.exit(1);}const r=JSON.parse(fs.readFileSync(p,"utf8"));const a=(r.testResults||[]).flatMap(function(f){return f.assertionResults||[];});const req=["G1. ","G2. ","H. "];let bad=false;for(const pre of req){const m=a.find(function(x){return typeof x.title==="string"&&x.title.startsWith(pre);});if(!m){console.error("FATAL: required test "+pre+"* was not executed");bad=true;}else if(m.status!=="passed"){console.error("FATAL: required test "+m.title+" has status "+m.status+" (expected passed)");bad=true;}else{console.log("OK: "+m.title);}}if(bad){console.error("Container-isolation proofs G1/G2/H did not all pass; failing the job.");process.exit(1);}console.log("G1/G2/H all executed and passed.");'

  # Backup/restore drill: proves a dump can actually be restored and that the
  # safety rails refuse a corrupt archive or a live target. Real PostgreSQL, no mocks.
  backup-drill:
    name: Backup & restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_PASSWORD: wasit_dev_password
          POSTGRES_DB: wasit_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wasit:wasit_dev_password@localhost:5432/wasit_dev
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/backup-restore.test.sh

  # Full E2E (Playwright) against the real API + PostgreSQL, no mocks.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_PASSWORD: wasit_dev_password
          POSTGRES_DB: wasit_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://wasit:wasit_dev_password@localhost:5432/wasit_dev
      TEST_DATABASE_URL: postgresql://wasit:wasit_dev_password@localhost:5432/wasit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2
      # Prepare the dev database the webServer/globalSetup run against.
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7