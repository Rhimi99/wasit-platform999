name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Lets a working branch run the gate on demand (the push filter above covers
  # only the integration branches), so a fix can be proven before it is merged.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Connection strings for the ephemeral PostgreSQL service container.
#
# `packages/server/tests/test-db-guard.ts` refuses every target except
# 127.0.0.1:5434/wasit_test. That guard is what keeps the destructive
# DROP/CREATE DATABASE path in `tests/setup.ts` away from a real server, so CI
# adapts to the guard instead of weakening it: each job publishes the throwaway
# container on host port 5434 and addresses it by that literal host. `localhost`
# and port 5432 are rejected by design.
#
# The container runs with `POSTGRES_HOST_AUTH_METHOD=trust` and no password. It
# is created per job, bound to 127.0.0.1 and destroyed with the runner, so there
# is no credential in this file to store, rotate or leak.
env:
  DATABASE_URL: postgresql://wasit@127.0.0.1:5434/wasit_dev
  TEST_DATABASE_URL: postgresql://wasit@127.0.0.1:5434/wasit_test
  WASIT_TEST_ADMIN_URL: postgresql://wasit@127.0.0.1:5434/postgres

jobs:
  # Fast gate: type-check both packages and build the server bundle.
  static:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2
      - run: npm run typecheck
      - run: npm run build -w @wasit/web
      - run: npm run build:prod -w @wasit/server

  # Unit + integration tests against a real PostgreSQL service.
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_DB: wasit_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # `--ignore-scripts` skips the postinstall that downloads ffmpeg-static's
      # binary, and npm 12+ blocks dependency install scripts unless they are
      # approved, so `npm rebuild ffmpeg-static` is not enough on newer npm.
      # The repo script runs the package's own installer and refuses to report
      # success unless `ffmpeg -version` works.
      - run: npm rebuild argon2
      - run: npm run media:setup
      # The marketing-video specs render real MP4s with Arabic text through
      # ffmpeg + libass and verify them with ffprobe. They fail — they do not
      # skip — when the renderer is missing, so the toolchain is installed
      # rather than the assertions relaxed.
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Verify media toolchain
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -filters | grep -q " ass " && echo "libass: present"

      # The marketing-video agent speaks every scene through piper, and its
      # delivery gate withholds a video that has no voice, so the voiceover
      # engine is part of the toolchain rather than an optional extra. The
      # installer downloads the MIT-licensed piper build and the four voice
      # models into packages/server/vendor/piper (git-ignored), speaks a test
      # line and probes the WAV; nothing here is committed.
      - uses: actions/cache@v4
        with:
          path: packages/server/vendor/piper
          key: piper-2023.11.14-2-voices-v1
      - name: Install voiceover engine (piper + voices)
        run: ./scripts/install-tts.sh
      - name: Verify voiceover engine
        run: |
          bin=packages/server/vendor/piper/piper
          test -x "$bin"
          for voice in ar_JO-kareem fr_FR-upmc en_US-lessac zh_CN-huayan; do
            test -s "packages/server/vendor/piper/voices/$voice-medium.onnx"
            test -s "packages/server/vendor/piper/voices/$voice-medium.onnx.json"
          done
          printf 'Ceci est un test de la voix WASIT.\n' | "$bin" \
            -m packages/server/vendor/piper/voices/fr_FR-upmc-medium.onnx -f /tmp/tts-check.wav 2>/dev/null
          seconds=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/tts-check.wav)
          echo "voiceover engine spoke ${seconds}s of audio"
          awk -v s="$seconds" 'BEGIN { exit (s > 1.0) ? 0 : 1 }'
      # vitest globalSetup drops/creates wasit_test and runs migrations + seed.
      - run: npm test

  # Backup/restore drill: proves a dump can actually be restored and that the
  # safety rails refuse a corrupt archive or a live target. Real PostgreSQL, no mocks.
  backup-drill:
    name: Backup & restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The drill shells out to the pg_dump/pg_restore that ship with the
        # runner, and the server must be new enough to accept what that client
        # writes: pg_dump 18 always emits `SET transaction_timeout = 0;`, which
        # a 16 server rejects, so the restore half of the drill fails. 17 is the
        # first major that knows the setting and the major this repo documents
        # for dev/prod. The app-facing jobs stay on 16 — they use the pure-JS
        # driver, which client/server skew does not affect.
        image: postgres:17
        env:
          POSTGRES_USER: wasit
          POSTGRES_DB: wasit_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # `age` enables the encryption sections of the drill (E3) plus the isolated
      # drop-order/guard sections (F1-F6); without it those sections SKIP, so the
      # install keeps the encrypted path covered. The pg_dump/pg_restore/psql the
      # drill drives come from the runner image and already match the server
      # image's major version.
      #
      # `age` is deliberately not pinned to an exact version: Ubuntu's archive
      # rotates patch releases, and the former pin
      # (`age=1.1.1-1ubuntu0.24.04.3`) is exactly what broke this job with
      # "Version ... was not found". The drill asserts behaviour, not a build.
      - name: Install drill tooling
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y age
          pg_dump --version
          pg_restore --version
      - run: ./scripts/backup-restore.test.sh

  # Full E2E (Playwright) against the real API + PostgreSQL, no mocks.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_DB: wasit_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2 ffmpeg-static
      # The video studio spec drives real renders through the API; without
      # ffmpeg the endpoint answers 502 and the studio specs fail.
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Verify media toolchain
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -filters | grep -q " ass " && echo "libass: present"

      # The marketing-video agent speaks every scene through piper, and its
      # delivery gate withholds a video that has no voice, so the voiceover
      # engine is part of the toolchain rather than an optional extra. The
      # installer downloads the MIT-licensed piper build and the four voice
      # models into packages/server/vendor/piper (git-ignored), speaks a test
      # line and probes the WAV; nothing here is committed.
      - uses: actions/cache@v4
        with:
          path: packages/server/vendor/piper
          key: piper-2023.11.14-2-voices-v1
      - name: Install voiceover engine (piper + voices)
        run: ./scripts/install-tts.sh
      - name: Verify voiceover engine
        run: |
          bin=packages/server/vendor/piper/piper
          test -x "$bin"
          for voice in ar_JO-kareem fr_FR-upmc en_US-lessac zh_CN-huayan; do
            test -s "packages/server/vendor/piper/voices/$voice-medium.onnx"
            test -s "packages/server/vendor/piper/voices/$voice-medium.onnx.json"
          done
          printf 'Ceci est un test de la voix WASIT.\n' | "$bin" \
            -m packages/server/vendor/piper/voices/fr_FR-upmc-medium.onnx -f /tmp/tts-check.wav 2>/dev/null
          seconds=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/tts-check.wav)
          echo "voiceover engine spoke ${seconds}s of audio"
          awk -v s="$seconds" 'BEGIN { exit (s > 1.0) ? 0 : 1 }'
      # Prepare the dev database the webServer/globalSetup run against.
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
