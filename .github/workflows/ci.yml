name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Lets a working branch run the gate on demand (the push filter above covers
  # only the integration branches), so a fix can be proven before it is merged.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Connection strings for the ephemeral PostgreSQL service container.
#
# `packages/server/tests/test-db-guard.ts` refuses every target except
# 127.0.0.1:5434/wasit_test. That guard is what keeps the destructive
# DROP/CREATE DATABASE path in `tests/setup.ts` away from a real server, so CI
# adapts to the guard instead of weakening it: each job publishes the throwaway
# container on host port 5434 and addresses it by that literal host. `localhost`
# and port 5432 are rejected by design.
#
# The container runs with `POSTGRES_HOST_AUTH_METHOD=trust` and no password. It
# is created per job, bound to 127.0.0.1 and destroyed with the runner, so there
# is no credential in this file to store, rotate or leak.
env:
  DATABASE_URL: postgresql://wasit@127.0.0.1:5434/wasit_dev
  TEST_DATABASE_URL: postgresql://wasit@127.0.0.1:5434/wasit_test
  WASIT_TEST_ADMIN_URL: postgresql://wasit@127.0.0.1:5434/postgres

jobs:
  # Fast gate: type-check both packages and build the server bundle.
  static:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2
      - run: npm run typecheck
      - run: npm run build -w @wasit/web
      - run: npm run build:prod -w @wasit/server

  # Unit + integration tests against a real PostgreSQL service.
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_DB: wasit_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # `--ignore-scripts` skips the postinstall that downloads ffmpeg-static's
      # binary; the video specs assert that bundled binary exists, so restore it
      # explicitly instead of dropping the assertion.
      - run: npm rebuild argon2 ffmpeg-static
      # The marketing-video specs render real MP4s and verify them with ffprobe.
      # They fail — they do not skip — when the renderer is missing, so the
      # toolchain is installed rather than the assertions relaxed.
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Verify media toolchain
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -filters | grep -q " ass " && echo "libass: present"
      # Piper is the offline voiceover engine. The voice specs assert it resolves
      # for every supported language; without it they skip, which would quietly
      # drop the audio half of the pipeline from the gate.
      - name: Install voiceover engine
        run: |
          ./scripts/install-tts.sh
          test -x ./packages/server/vendor/piper/piper/piper
      # vitest globalSetup drops/creates wasit_test and runs migrations + seed.
      - run: npm test

  # Backup/restore drill: proves a dump can actually be restored and that the
  # safety rails refuse a corrupt archive or a live target. Real PostgreSQL, no mocks.
  backup-drill:
    name: Backup & restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_DB: wasit_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # /usr/bin/pg_dump on Debian/Ubuntu is pg_wrapper, which defaults to the
      # newest installed major version. Pin it to the service image's version so
      # the dump and the server always agree.
      PGVERSION: "16"
    steps:
      - uses: actions/checkout@v4
      # `age` enables the encryption sections of the drill (E3) plus the isolated
      # drop-order/guard sections (F1-F6); without it those sections SKIP, so the
      # install keeps the encrypted path covered. `postgresql-client-16` supplies
      # the pg_dump/pg_restore/psql the drill drives, and must match the server
      # image: a newer client emits `SET transaction_timeout = 0;` into the dump,
      # which PostgreSQL 16 rejects, so the restore half of the drill fails.
      #
      # `age` is deliberately not pinned to an exact version: Ubuntu's archive
      # rotates patch releases, and the former pin
      # (`age=1.1.1-1ubuntu0.24.04.3`) is exactly what broke this job with
      # "Version ... was not found". The drill asserts behaviour, not a build.
      - name: Install drill tooling
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-16
      - run: ./scripts/backup-restore.test.sh

  # Full E2E (Playwright) against the real API + PostgreSQL, no mocks.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasit
          POSTGRES_DB: wasit_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U wasit -d wasit_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild argon2 ffmpeg-static
      # The video studio spec drives real renders through the API; without
      # ffmpeg the endpoint answers 502 and the studio specs fail.
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Verify media toolchain
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -filters | grep -q " ass " && echo "libass: present"
      - name: Install voiceover engine
        run: |
          ./scripts/install-tts.sh
          test -x ./packages/server/vendor/piper/piper/piper
      # Prepare the dev database the webServer/globalSetup run against.
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
